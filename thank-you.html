
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | Brin Hart Basketball</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: repeating-linear-gradient(
        135deg,
        #e6f3fb 0px,
        #e6f3fb 38px,
        #c6e2f5 39px,
        #e6f3fb 40px
      );
      color: #061f38;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: #061f38;
      color: white;
      border-radius: 18px;
      padding: 55px 35px;
      box-shadow: 0 15px 40px rgba(6,31,56,.18);
    }

    .eyebrow {
      color: #c5a061;
      letter-spacing: 3px;
      font-size: 13px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(32px, 6vw, 48px);
      margin: 22px 0 12px;
    }

    h1 span { color: #78c4f0; }

    .line {
      width: 75px;
      height: 3px;
      background: #c5a061;
      margin: 24px auto;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
      color: #e1edf5;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      background: #78c4f0;
      color: #061f38;
      text-decoration: none;
      padding: 16px 30px;
      border-radius: 7px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      color: #c5a061;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">BRIN HART BASKETBALL | CLASS OF 2031</div>

    <h1>THANK YOU FOR <span>CONNECTING!</span></h1>

    <div class="line"></div>

    <p>
      Your message has been received! Thank you for
      your interest in Brin Hart Basketball.
      We appreciate you reaching out and look
      forward to connecting with you.
    </p>

    <a class="button" href="index.html">
      BACK TO BRIN'S WEBSITE &rarr;
    </a>

    <div class="footer">
      YOU VS. YOU. ALWAYS NEXT PLAY.
    </div>
  </main>
</body>
</html>
